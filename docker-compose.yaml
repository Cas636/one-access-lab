services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: c-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  database:
    image: postgres:17
    container_name: c-fusionauth-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"


  fusionauth:
    image: fusionauth/fusionauth-app:latest
    container_name: c-fusionauth

    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DATABASE_ROOT_USERNAME: ${POSTGRES_USER}
      DATABASE_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      database:
        condition: service_healthy
    ports:
      - "9011:9011"

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: c-frontend-react
      ports:
        - "3000:80"

  backend:
      build:
        context: ./api
        dockerfile: Dockerfile
      container_name: c-backend-fastapi
      ports:
        - "8030:8030"


volumes:
  postgres_data:
